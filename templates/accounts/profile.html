{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">My Profile</h2>
  <div class="card form-card" style="max-width: 520px;">
    <div class="card-body p-4">
      <p class="mb-4">Username: {{ user.username }}<br>Role: {{ user.get_role_display }}</p>
      <form method="post">
        {% csrf_token %}{{ form.as_p }}
        <button type="submit" class="btn btn-market">Save</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
