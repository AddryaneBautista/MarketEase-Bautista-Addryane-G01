{% extends "base.html" %}
{% block title %}Sign Up | MarketEase{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <h3 class="auth-title">Create your account</h3>
      <p class="auth-description">
        Get started with MarketEase.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-market w-100 mt-3">
          Create account
        </button>
      </form>
      <p class="auth-footer">
        Already have an account?
        <a href="{% url 'login' %}">Log in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
