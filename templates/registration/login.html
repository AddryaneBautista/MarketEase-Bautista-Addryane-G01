{% extends "base.html" %}
{% block title %}Log In | MarketEase{% endblock %}
{% block content %}
<div class="auth-container">
  <div class="card auth-card">
    <div class="card-body p-4 p-md-5">
      <h3 class="auth-title">Welcome back</h3>
      <p class="auth-description">
        Log in to your MarketEase account.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-market w-100 mt-3">
          Log in
        </button>
      </form>
      <p class="auth-footer">
        Don't have an account?
        <a href="{% url 'signup' %}">Sign up</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
