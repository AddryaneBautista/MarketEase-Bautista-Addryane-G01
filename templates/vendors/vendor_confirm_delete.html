{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">Delete vendor {{ object }}?</h2>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Confirm delete</button>
    <a href="{% url 'vendors:list' %}" class="btn btn-outline-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
