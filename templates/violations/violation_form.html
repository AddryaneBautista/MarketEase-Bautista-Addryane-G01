{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4">{% if object %}Edit{% else %}New{% endif %} Violation</h2>
  <div class="card form-card" style="max-width: 520px;">
    <div class="card-body p-4">
      <form method="post">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {{ form.as_p }}
        <button type="submit" class="btn btn-market">Save</button>
        <a href="{% url 'violations:list' %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
